<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workshop Guide | Give the Body a Brain</title>
  <meta name="description" content="Step-by-step workshop guide for building a voice-based physical AI companion with Agora Bot Station and ReSpeaker Flex.">
  <style>
    :root {
      --ink: #17353c;
      --ink-soft: #506d74;
      --paper: #f4fbfb;
      --cyan: #1fc7d1;
      --cyan-deep: #058f99;
      --coral: #ff6268;
      --sun: #ffd55f;
      --line: rgba(5, 143, 153, 0.2);
      --code: #173d46;
      --max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 88px;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(rgba(31, 199, 209, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 199, 209, 0.055) 1px, transparent 1px),
        var(--paper);
      background-size: 36px 36px;
      font-family: "Avenir Next", "Trebuchet MS", Verdana, sans-serif;
    }

    a {
      color: var(--cyan-deep);
      font-weight: 700;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    a:hover,
    a:focus-visible {
      color: #9d3036;
    }

    .reader-header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
    }

    .reader-header-inner {
      display: flex;
      width: min(calc(100% - 32px), var(--max));
      min-height: 66px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 14px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand img {
      width: 82px;
      height: auto;
    }

    .brand span {
      overflow: hidden;
      font-size: 0.72rem;
      font-weight: 900;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
    }

    .header-action {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--cyan-deep);
      background: #ffffff;
      font-size: 0.72rem;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
    }

    .header-action.primary {
      color: #ffffff;
      border-color: var(--coral);
      background: var(--coral);
      box-shadow: 4px 4px 0 rgba(31, 199, 209, 0.7);
    }

    .reader-shell {
      display: grid;
      width: min(calc(100% - 32px), var(--max));
      grid-template-columns: 230px minmax(0, 820px);
      justify-content: center;
      gap: clamp(28px, 5vw, 72px);
      margin: 0 auto;
      padding: 42px 0 80px;
    }

    .toc {
      position: sticky;
      top: 94px;
      align-self: start;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      padding: 2px 14px 18px 0;
      border-right: 1px solid var(--line);
    }

    .toc-label {
      display: block;
      margin-bottom: 12px;
      color: var(--coral);
      font-size: 0.65rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .toc-links {
      display: grid;
      gap: 3px;
    }

    .toc a {
      display: block;
      padding: 7px 9px;
      border-left: 3px solid transparent;
      color: var(--ink-soft);
      font-size: 0.76rem;
      line-height: 1.25;
      text-decoration: none;
    }

    .toc a:hover,
    .toc a:focus-visible {
      border-left-color: var(--cyan);
      color: var(--ink);
      background: rgba(31, 199, 209, 0.08);
      outline: none;
    }

    .toc a.level-3 {
      padding-left: 20px;
      font-size: 0.7rem;
    }

    .markdown-body {
      min-width: 0;
      padding: clamp(24px, 5vw, 58px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 12px 12px 0 rgba(255, 98, 104, 0.13), 0 28px 70px rgba(34, 109, 118, 0.12);
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3 {
      scroll-margin-top: 88px;
      letter-spacing: 0;
      line-height: 1.12;
    }

    .markdown-body h1 {
      margin: 0 0 18px;
      font-size: clamp(2.25rem, 6vw, 4.6rem);
      max-width: 760px;
    }

    .markdown-body h1::after {
      content: "";
      display: block;
      width: 118px;
      height: 6px;
      margin-top: 18px;
      background: linear-gradient(90deg, var(--cyan), var(--sun), var(--coral));
    }

    .markdown-body h2 {
      margin: 54px 0 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: clamp(1.65rem, 3vw, 2.35rem);
    }

    .markdown-body h3 {
      margin: 32px 0 10px;
      color: var(--cyan-deep);
      font-size: 1.2rem;
    }

    .markdown-body p,
    .markdown-body li {
      color: var(--ink-soft);
      font-size: 0.98rem;
      line-height: 1.72;
    }

    .markdown-body > p:first-of-type {
      color: var(--ink);
      font-size: 1.16rem;
      line-height: 1.55;
    }

    .markdown-body strong {
      color: var(--ink);
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 1.4rem;
    }

    .markdown-body li + li {
      margin-top: 5px;
    }

    .table-wrap {
      margin: 20px 0;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    .markdown-body th,
    .markdown-body td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .markdown-body th {
      color: var(--ink);
      background: #e8f8f8;
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    .markdown-body tr:last-child td {
      border-bottom: 0;
    }

    .markdown-body pre {
      margin: 20px 0;
      padding: 18px;
      overflow-x: auto;
      border-left: 4px solid var(--cyan);
      border-radius: 4px;
      color: #e7fdff;
      background: var(--code);
      font: 600 0.82rem/1.65 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .markdown-body code {
      padding: 0.12em 0.34em;
      border-radius: 3px;
      color: #9d3036;
      background: #fff0f0;
      font: 650 0.88em/1.4 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .markdown-body pre code {
      padding: 0;
      color: inherit;
      background: transparent;
      font: inherit;
    }

    .markdown-body img {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 620px;
      margin: 24px auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 7px 7px 0 rgba(31, 199, 209, 0.16);
    }

    .reader-status {
      min-height: 50vh;
      display: grid;
      place-items: center;
      color: var(--ink-soft);
      font-weight: 800;
    }

    .reader-error {
      padding: 18px;
      border: 2px solid var(--coral);
      color: var(--ink);
      background: #fff1f1;
    }

    @media (max-width: 820px) {
      html {
        scroll-padding-top: 74px;
      }

      .reader-header-inner {
        min-height: 58px;
      }

      .brand span {
        display: none;
      }

      .reader-shell {
        display: block;
        width: min(calc(100% - 20px), 760px);
        padding-top: 14px;
      }

      .toc {
        position: sticky;
        top: 58px;
        z-index: 8;
        display: flex;
        max-height: none;
        gap: 8px;
        margin: 0 -10px 12px;
        padding: 9px 10px;
        overflow-x: auto;
        border-right: 0;
        border-block: 1px solid var(--line);
        background: rgba(244, 251, 251, 0.96);
      }

      .toc-label {
        display: none;
      }

      .toc-links {
        display: flex;
        gap: 4px;
      }

      .toc a,
      .toc a.level-3 {
        min-width: max-content;
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #ffffff;
        font-size: 0.68rem;
      }

      .markdown-body {
        padding: 24px 18px 42px;
        box-shadow: 6px 6px 0 rgba(255, 98, 104, 0.12);
      }

      .markdown-body h1 {
        font-size: clamp(2.2rem, 13vw, 3.4rem);
      }

      .markdown-body h2 {
        margin-top: 42px;
      }

      .markdown-body p,
      .markdown-body li {
        font-size: 0.9rem;
      }
    }

    @media (max-width: 470px) {
      .reader-header-inner {
        width: calc(100% - 20px);
      }

      .brand img {
        width: 68px;
      }

      .header-action {
        min-height: 32px;
        padding: 6px 8px;
        font-size: 0.64rem;
      }

      .header-action.primary {
        display: none;
      }

      .markdown-body h1 {
        overflow-wrap: anywhere;
      }
    }

    html[data-raw-mode="true"] .reader-header,
    html[data-raw-mode="true"] .toc {
      display: none;
    }

    html[data-raw-mode="true"] .reader-shell {
      display: block;
      width: min(100%, 1040px);
      margin: 0 auto;
      padding: 0;
    }

    html[data-raw-mode="true"] .markdown-body {
      min-height: 100vh;
      max-width: none;
      padding: clamp(24px, 5vw, 72px) clamp(16px, 4vw, 48px);
      border-inline: 1px solid rgba(5, 143, 153, 0.16);
      font: 500 14px/1.65 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <header class="reader-header">
    <div class="reader-header-inner">
      <a class="brand" href="../" aria-label="Back to workshop deck">
        <img src="../Agora_Logo.png" alt="Agora">
        <span>ReSpeaker Flex Workshop Guide</span>
      </a>
      <div class="header-actions">
        <a class="header-action" href="../README.md">Raw Markdown</a>
        <a class="header-action primary" href="../">Open Deck</a>
      </div>
    </div>
  </header>

  <div class="reader-shell">
    <nav class="toc" aria-label="Workshop guide sections">
      <span class="toc-label">On this page</span>
      <div class="toc-links" id="toc-links"></div>
    </nav>
    <main class="markdown-body" id="markdown-body">
      <div class="reader-status">Loading workshop guide...</div>
      <noscript>
        <p>This reader requires JavaScript. Open <a href="../README.md">README.md</a> to read the source.</p>
      </noscript>
    </main>
  </div>

  <script src="../marked.min.js"></script>
  <script>
    (async function () {
      const article = document.getElementById("markdown-body");
      const toc = document.getElementById("toc-links");
      const rawMode = new URLSearchParams(window.location.search).has("raw");

      if (rawMode) document.documentElement.dataset.rawMode = "true";

      try {
        const response = await fetch("../README.md", { cache: "no-cache" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const markdown = await response.text();

        if (rawMode) {
          article.textContent = markdown;
          article.setAttribute("aria-label", "Raw workshop Markdown");
          document.title = "README.md | Give the Body a Brain";
          return;
        }

        if (!window.marked) throw new Error("Markdown renderer unavailable");
        article.innerHTML = window.marked.parse(markdown, { gfm: true });

        const slugCounts = new Map();
        article.querySelectorAll("h1, h2, h3").forEach((heading) => {
          const base = heading.textContent
            .toLowerCase()
            .trim()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-|-$/g, "") || "section";
          const count = slugCounts.get(base) || 0;
          slugCounts.set(base, count + 1);
          heading.id = count ? `${base}-${count + 1}` : base;

          if (heading.tagName !== "H1") {
            const link = document.createElement("a");
            link.href = `#${heading.id}`;
            link.textContent = heading.textContent;
            link.className = `level-${heading.tagName.slice(1)}`;
            toc.appendChild(link);
          }
        });

        article.querySelectorAll("a[href], img[src]").forEach((element) => {
          const attribute = element.tagName === "IMG" ? "src" : "href";
          const value = element.getAttribute(attribute);
          if (!value || /^(?:[a-z]+:|\/\/|\/|#)/i.test(value)) return;
          element.setAttribute(attribute, `../${value.replace(/^\.\//, "")}`);
        });

        article.querySelectorAll("a[href]").forEach((link) => {
          if (/^https?:/i.test(link.href)) {
            link.target = "_blank";
            link.rel = "noreferrer";
          }
        });

        article.querySelectorAll("img").forEach((image) => {
          image.loading = "lazy";
          image.decoding = "async";
        });

        article.querySelectorAll("table").forEach((table) => {
          const wrapper = document.createElement("div");
          wrapper.className = "table-wrap";
          table.parentNode.insertBefore(wrapper, table);
          wrapper.appendChild(table);
        });
      } catch (error) {
        article.innerHTML = `<div class="reader-error"><strong>Unable to load the workshop guide.</strong><p>${error.message}</p><a href="../README.md">Open README.md directly</a></div>`;
      }
    })();
  </script>
</body>
</html>
